schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: Mindbattle, an intellectual competitive game for a group of friends.
  Treat docs/GAME_SPEC.md as the canonical source for approved product, gameplay,
  visual, UI, technical, accessibility, and competitive-integrity decisions.
  Do not invent unresolved choices. Record them as open decisions and obtain the
  user's confirmation before implementation.

  The genre, target platforms, player count, session topology, input devices,
  presentation dimension, engine, and network model are not approved yet. Do not
  infer local, online, browser, desktop, 2D, 3D, real-time, or turn-based behavior
  until the relevant decision is recorded in GAME_SPEC.

  Keep authoritative game rules and serializable match state separate from
  presentation, UI, physical input, audio, and asset loading. Make randomness,
  hidden information, timing, scoring, tie-breaks, and player departure behavior
  explicit whenever they affect competitive fairness. Require automated evidence
  for game rules and a real target-platform multiplayer playtest for interaction
  and social-session claims.

rules:
  proposal:
    - State player impact, scope, non-goals, dependencies, and every product decision still open.
    - Cite the affected docs/GAME_SPEC.md sections for gameplay, match flow, input, UI, AI, save, networking, assets, accessibility, or competitive-integrity changes.
    - For new mechanics, state the intended skill expression and the roles of information, randomness, time pressure, scoring, elimination, comeback, and tie-breaks.
  design:
    - Define ownership of authoritative rules and match state separately from presentation, UI, physical input, audio, networking, persistence, and asset loading.
    - Specify command ordering, clocks, random seeds, replay or synchronization boundaries, and failure recovery whenever they can affect equal outcomes.
    - When multiplayer is relevant, define session topology, join and leave behavior, reconnect policy, host authority, and the minimum supported player configuration.
  spec:
    - Write testable requirements and scenarios; distinguish individual players, teams, spectators, and AI whenever those roles exist.
    - Cover fair initialization, simultaneous or timed actions, hidden information, deterministic tie-breaks, invalid actions, and interrupted participants whenever relevant.
    - Keep OpenSpec structural headings and the ADDED, MODIFIED, REMOVED, RENAMED, Requirement, Scenario, WHEN, THEN, SHALL, and MUST markers in English.
  tasks:
    - Keep implementation, automated rule tests, strict OpenSpec validation, and a real target-platform multiplayer playtest as explicit tasks.
    - Include GAME_SPEC synchronization and concise verification evidence before completion.
    - Keep one coherent feature per change; do not mix unrelated rules, UI, audio, balance, AI, networking, assets, or bug work.

operations:
  apply:
    guidance:
      - Read the active change artifacts and the relevant GAME_SPEC sections before editing.
      - Preserve unrelated working-tree changes, keep tasks current, and report concise test evidence.
      - Do not close an unresolved product decision through an implementation detail.
      - Verify interaction and group-play claims in the real target environment whenever they are affected.
  archive:
    guidance:
      - Archive only after strict validation, required automated checks, target-environment playtest evidence, GAME_SPEC synchronization, and the dedicated commit are complete.
      - Confirm that approved delta requirements are represented in canonical specs and that all tasks are completed.
