appId: tech.afonasev.mindbattle
productName: Mindbattle
directories:
  app: desktop-app
  output: desktop-installers
files:
  - desktop/**/*
  - package.json
asar: true
npmRebuild: false
afterPack: scripts/desktop/layout-hook.cjs
extraResources:
  - from: public/icons/mindbattle-512.png
    to: mindbattle-icon.png
  - from: desktop/install-identity.json
    to: mindbattle-installation.json
artifactName: Mindbattle-${version}-${os}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.trivia-games
  identity: null
  icon: public/icons/mindbattle-512.png
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/icons/mindbattle-512.png
nsis:
  installerLanguages: [en_US, ru_RU]
  oneClick: false
  perMachine: true
  artifactName: Mindbattle-${version}.${ext}
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  runAfterFinish: true
  include: desktop/installer.nsh
  deleteAppDataOnUninstall: false
